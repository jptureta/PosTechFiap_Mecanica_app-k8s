apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-service
  namespace: oficina
spec:
  replicas: 2
  selector:
    matchLabels:
      app: os-service
  template:
    metadata:
      labels:
        app: os-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: os-service
          image: ghcr.io/jptureta/oficina-os-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: os-service-secrets
                  key: database-url
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: internal-service-token
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: jwt-secret-key
            - name: JWT_ALGORITHM
              value: HS256
            - name: BILLING_URL
              value: http://billing-service:8000
            - name: INVENTORY_URL
              value: http://inventory-service:8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: os-service
  namespace: oficina
spec:
  selector:
    app: os-service
  ports:
    - port: 8000
      targetPort: 8000

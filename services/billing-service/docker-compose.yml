services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: billing_service
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina -d billing_service"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - billing_data:/var/lib/postgresql/data
  billing-service:
    build: .
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://oficina:oficina-local@db:5432/billing_service
      OS_SERVICE_URL: http://os-service:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-only-change-me}
      PAYMENT_PROVIDER_TOKEN: ${PAYMENT_PROVIDER_TOKEN:-local-only-change-me}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-only-change-me}
      JWT_ALGORITHM: HS256
    depends_on:
      db:
        condition: service_healthy
volumes:
  billing_data:
